<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">EU AI Act transparency obligations for providers and deployers</title>
  <desc id="description">A two-lane process diagram showing providers adding machine-readable marks and interaction notices, while deployers add visible disclosures for people exposed to AI systems and generated content.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#c8d4d1" stroke-width="1" opacity="0.32"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#163631" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b665c"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f4f1e9"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="0" y="0" width="18" height="900" fill="#d8a84e"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#173d37">
    <text x="112" y="122" font-size="28" font-weight="700" letter-spacing="2">EU AI ACT · ARTICLE 50</text>
    <text x="112" y="202" font-size="58" font-weight="700">Transparency follows the role</text>
  </g>
  <text x="114" y="252" fill="#46635e" font-family="'Helvetica Neue', sans-serif" font-size="24">Classify the actor and trigger before choosing the control.</text>

  <g filter="url(#shadow)">
    <rect x="112" y="320" width="1376" height="416" rx="8" fill="#fffdf8" stroke="#b8c8c4" stroke-width="2"/>
  </g>

  <line x1="800" y1="352" x2="800" y2="704" stroke="#b8c8c4" stroke-width="2"/>

  <g font-family="'Helvetica Neue', sans-serif">
    <rect x="152" y="360" width="156" height="42" rx="4" fill="#173d37"/>
    <text x="230" y="389" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">PROVIDER</text>
    <text x="152" y="446" fill="#173d37" font-size="31" font-weight="700">Build transparency in</text>

    <g transform="translate(152 486)">
      <rect width="224" height="120" rx="6" fill="#e4efec" stroke="#78a098" stroke-width="2"/>
      <circle cx="40" cy="40" r="17" fill="none" stroke="#2b665c" stroke-width="4"/>
      <path d="M 30 41 L 37 48 L 51 32" fill="none" stroke="#2b665c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="84" fill="#173d37" font-size="19" font-weight="700">AI interaction</text>
      <text x="24" y="107" fill="#46635e" font-size="16">notice</text>
    </g>

    <line x1="392" y1="546" x2="446" y2="546" stroke="#2b665c" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(466 486)">
      <rect width="266" height="120" rx="6" fill="#e4efec" stroke="#78a098" stroke-width="2"/>
      <g fill="#2b665c">
        <rect x="24" y="24" width="7" height="32"/>
        <rect x="36" y="24" width="3" height="32"/>
        <rect x="44" y="24" width="9" height="32"/>
        <rect x="58" y="24" width="4" height="32"/>
        <rect x="67" y="24" width="7" height="32"/>
      </g>
      <text x="24" y="84" fill="#173d37" font-size="19" font-weight="700">Machine-readable</text>
      <text x="24" y="107" fill="#46635e" font-size="16">marking and detection</text>
    </g>

    <text x="152" y="660" fill="#46635e" font-size="18">Technical controls travel with the system and output.</text>

    <rect x="850" y="360" width="156" height="42" rx="4" fill="#a6602c"/>
    <text x="928" y="389" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">DEPLOYER</text>
    <text x="850" y="446" fill="#173d37" font-size="31" font-weight="700">Disclose at exposure</text>

    <g transform="translate(850 486)">
      <rect width="240" height="120" rx="6" fill="#f8ead8" stroke="#c68a52" stroke-width="2"/>
      <path d="M 24 47 C 39 29, 62 29, 77 47 C 62 65, 39 65, 24 47 Z" fill="none" stroke="#a6602c" stroke-width="4"/>
      <circle cx="51" cy="47" r="8" fill="#a6602c"/>
      <text x="24" y="84" fill="#173d37" font-size="19" font-weight="700">People exposed</text>
      <text x="24" y="107" fill="#6f563f" font-size="16">to system operation</text>
    </g>

    <line x1="1106" y1="546" x2="1160" y2="546" stroke="#a6602c" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(1180 486)">
      <rect width="260" height="120" rx="6" fill="#f8ead8" stroke="#c68a52" stroke-width="2"/>
      <path d="M 24 24 H 70 V 62 H 24 Z M 31 55 L 42 42 L 50 50 L 58 36 L 66 55 Z" fill="none" stroke="#a6602c" stroke-width="3" stroke-linejoin="round"/>
      <text x="24" y="84" fill="#173d37" font-size="19" font-weight="700">Visible disclosure</text>
      <text x="24" y="107" fill="#6f563f" font-size="16">at first exposure</text>
    </g>

    <text x="850" y="660" fill="#6f563f" font-size="18">Human-facing controls meet the audience in context.</text>
  </g>

  <g transform="translate(112 790)" font-family="'Helvetica Neue', sans-serif">
    <circle cx="12" cy="12" r="12" fill="#d8a84e"/>
    <path d="M 7 12 L 11 16 L 18 8" fill="none" stroke="#173d37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="20" fill="#173d37" font-size="21" font-weight="700">One use case · two control layers · evidence for both</text>
  </g>
</svg>
